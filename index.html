<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="canonical" href="https://fretpulse.ir">
    <link rel="manifest" href="site.webmanifest">
    <link href="libs/fontawesome/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="style.css" rel="stylesheet" type="text/css">
    <title>FretPulse: Professional Multi-Instrument Tuner</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="FretPulse">
    <meta name="description" content="FretPulse is a professional tuner with real-time pitch detection, custom tunings, and adjustable A4 calibration.">
    <meta name="author" content="Sepand Haghighi">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="FretPulse: Professional Multi-Instrument Tuner">
    <meta property="og:description" content="FretPulse is a professional tuner with real-time pitch detection, custom tunings, and adjustable A4 calibration.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fretpulse.ir">
    <meta property="og:image" content="https://fretpulse.ir/assets/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FretPulse: Professional Multi-Instrument Tuner">
    <meta name="twitter:description" content="FretPulse is a professional tuner with real-time pitch detection, custom tunings, and adjustable A4 calibration.">
    <meta name="twitter:image" content="https://fretpulse.ir/assets/og-preview.png">
    <meta name="theme-color" content="#ffffff">
</head>
<body>

    <header>
        <h1>FretPulse</h1>
        <p>Professional Multi-Instrument Web Tuner</p>
    </header>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="instrument-select">
                    <i class="fa-solid fa-guitar" aria-hidden="true"></i>
                    Instrument
                </label>
                <select id="instrument-select">
                    <option value="acoustic">Acoustic Guitar (6 String)</option>
                    <option value="electric">Electric Guitar (6 String)</option>
                    <option value="ukulele">Ukulele (4 String)</option>
                    <option value="bass">Bass Guitar (4 String)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="tuning-select">
                    <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                    Tuning Preset
                </label>
                <select id="tuning-select">
                </select>
            </div>

            <div class="control-group">
                <label for="a4-slider">
                    <i class="fa-solid fa-wave-square" aria-hidden="true"></i>
                    Pitch A4
                    <span id="a4-val-display" class="freq-badge">440 Hz</span>
                </label>
                <div class="calibration-controls">
                    <input type="range" id="a4-slider" min="430" max="450" value="440" step="1">
                </div>
            </div>

            <div class="control-group">
                <label>
                    <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
                    Mode
                </label>
                <div class="btn-toggle-group">
                    <button id="btn-auto" class="active" type="button">
                        <i class="fa-solid fa-bullseye" aria-hidden="true"></i>
                        Auto
                    </button>
                    <button id="btn-manual" type="button">
                        <i class="fa-solid fa-hand-pointer" aria-hidden="true"></i>
                        Manual
                    </button>
                </div>
            </div>
        </div>

        <div id="custom-editor" class="custom-editor">
        </div>
        <div class="display-card">
            <div class="gauge-container">
                <div class="gauge-arc"></div>
                <div id="needle" class="gauge-needle"></div>
                <div class="gauge-center-dot"></div>
            </div>

            <div id="note-display" class="note-display">--</div>
            <div id="cents-display" class="cents-display">0 Cents</div>
            <div id="freq-display" class="freq-display">0.0 Hz</div>
            <div id="status-badge" class="status-badge">Reference A4 = 440 Hz</div>

            <button id="mic-btn" class="mic-btn" type="button">
                <i class="fa-solid fa-microphone" aria-hidden="true"></i>
                Start Microphone
            </button>

            <p class="keyboard-hint">
                <i class="fa-regular fa-keyboard" aria-hidden="true"></i>
                Space: Microphone &bull; A: Auto &bull; M: Manual
                &bull; <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                : String
            </p>

        </div>

        <div class="neck-card">
            <div class="neck-header">
                <span class="neck-title">
                    <i class="fa-solid fa-guitar" aria-hidden="true"></i>
                    INTERACTIVE FRETBOARD
                </span>
                <span id="manual-hint" class="manual-hint">
                    <i class="fa-solid fa-hand-pointer" aria-hidden="true"></i>
                    Click string peg to pluck reference tone
                </span>
            </div>
            <div class="fretboard-wrapper">
                <div id="strings-container" class="strings-container">
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>
            <i class="fa-solid fa-wave-square" aria-hidden="true"></i>
            FretPulse <span id="app-version"></span>
            &bull; Professional Multi-Instrument Tuner
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
